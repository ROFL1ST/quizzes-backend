version: "3.8"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ML_SERVICE_URL=http://ml-service:5002
      - DB_HOST=postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=5432
    depends_on:
      - ml-service
      - postgres
    restart: on-failure

  ml-service:
    build: ../ml-service
    ports:
      - "5002:5002"
    restart: on-failure

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-quizzes}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
